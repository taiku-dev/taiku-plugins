name: validate-registry

on:
  pull_request:
    paths:
      - community-plugins.json
      - scripts/validate*.mjs
      - .github/workflows/validate.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test release verification
        run: node --test scripts/validate.test.mjs

      - name: Extract base version of the registry
        run: |
          git show "origin/${{ github.base_ref }}:community-plugins.json" > /tmp/base-registry.json 2>/dev/null || echo '{"plugins":[]}' > /tmp/base-registry.json

      - name: Validate schema and changed reviewed releases
        id: validate
        run: node scripts/validate.mjs community-plugins.json /tmp/base-registry.json

      - name: Label new or changed releases for manual review
        if: steps.validate.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-manual-review'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'This PR changes a marketplace release. A maintainer must review the code and files at the exact pinned commit and release digest before merging. The workflow log identifies integrations that require extra permission review.',
            });

      - name: Fail if schema invalid
        if: steps.validate.outputs.schema_ok != 'true'
        run: |
          echo "::error::community-plugins.json failed schema validation — see log above."
          exit 1
