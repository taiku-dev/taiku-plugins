name: validate-registry

on:
  pull_request:
    paths:
      - community-plugins.json
      - scripts/validate.mjs

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract base version of the registry
        run: |
          git show "origin/${{ github.base_ref }}:community-plugins.json" > /tmp/base-registry.json 2>/dev/null || echo '{"plugins":[]}' > /tmp/base-registry.json

      - name: Validate schema + scan new plugins for integrations
        id: validate
        run: node scripts/validate.mjs community-plugins.json /tmp/base-registry.json

      - name: Label integration plugins for manual review
        if: steps.validate.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-manual-review'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ This PR adds a plugin that declares **`integrations`** (it brokers third-party API access via Composio). Per policy it **requires manual maintainer review** before merge — see the workflow log for the toolkits involved.',
            });

      - name: Fail if schema invalid
        if: steps.validate.outputs.schema_ok != 'true'
        run: |
          echo "::error::community-plugins.json failed schema validation — see log above."
          exit 1
